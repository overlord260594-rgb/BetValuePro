name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download and Unzip Project
        run: |
          pip install requests
          python -c "
          import requests, urllib.parse, json
          public_key = 'https://disk.yandex.ru/d/8YOG9XVt8Eatig'
          base_url = 'https://cloud-api.yandex.net/v1/disk/public/resources/download?'
          final_url = base_url + urllib.parse.urlencode({'public_key': public_key})
          response = requests.get(final_url)
          response.raise_for_status()
          download_url = response.json()['href']
          r = requests.get(download_url, stream=True)
          with open('project.zip', 'wb') as f:
              for chunk in r.iter_content(chunk_size=8192):
                  f.write(chunk)
          print('Archive downloaded successfully')
          "
          unzip project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/*.apk
